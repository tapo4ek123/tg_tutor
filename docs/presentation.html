<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SkillPilot: устройство AI-тьютора, построение плана и занятий, MCP и проверка прогресса"><title>SkillPilot — AI-тьютор: презентация проекта</title><style>:root { color-scheme:dark; --bg:#121b20; --fg:#f3f1e9; --muted:#a6b4ba; --line:#415259; --accent:#c4ef82; }
* { box-sizing:border-box; }
body { margin:0; color:var(--fg); background:var(--bg); font-family:Arial,sans-serif; }
a { color:var(--accent); text-underline-offset:4px; }
button { font:inherit; color:var(--fg); cursor:pointer; background:transparent; border:1px solid var(--line); border-radius:6px; padding:9px 13px; }
button:hover { border-color:var(--accent); }
button:disabled { cursor:default; opacity:.25; }
button:focus-visible,a:focus-visible,[role="button"]:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
.toolbar { height:67px; padding:0 3.5vw; display:flex; align-items:center; gap:24px; border-bottom:1px solid #2a3b43; }
.brand { color:var(--fg); text-decoration:none; font-size:21px; letter-spacing:-.5px; font-weight:700; }
.brand span { color:var(--accent); }
.subtitle { color:var(--muted); font-size:14px; }
.tools { display:flex; margin-left:auto; gap:10px; font-size:13px; }
#stage { height:calc(100dvh - 133px); display:flex; align-items:center; justify-content:center; padding:10px 20px; }
.slide { width:min(1280px,calc((100dvh - 155px)*16/9)); max-width:100%; aspect-ratio:16/9; }
.slide[hidden] { display:none; }
.slide svg { width:100%; height:auto; display:block; }
.choice { cursor:pointer; }
.choice:hover rect { stroke:#c4ef82; }
.choice[aria-pressed="true"] rect { fill:#c4ef82; stroke:#c4ef82; }
.choice[aria-pressed="true"] text { fill:#121b20; }
.arch-node.active rect { stroke:#c4ef82; stroke-width:3; }
.arch-node.active text:first-of-type { fill:#c4ef82; }
.navigation { height:66px; padding:0 3.5vw; border-top:1px solid #2a3b43; display:flex; align-items:center; gap:13px; }
#chapter-label { color:var(--muted); font-size:14px; min-width:190px; }
.slide-progress { height:3px; background:#2b3c43; flex:1; max-width:500px; margin-right:14px; }
#deck-progress { display:block; height:100%; background:var(--accent); width:7.142%; transition:width .2s; }
#counter { font-size:14px; color:var(--muted); min-width:60px; text-align:right; }
.keyhint { color:var(--muted); font-size:12px; margin-left:auto; }
#speaker-notes { position:fixed; z-index:3; right:20px; top:80px; bottom:80px; width:min(440px,calc(100vw - 40px)); padding:28px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#18262df5; box-shadow:0 12px 65px #0007; font-size:16px; line-height:1.6; }
#speaker-notes[hidden] { display:none; }
#speaker-notes h2 { font-size:24px; line-height:1.3; margin:12px 0 20px; }
#speaker-notes h3 { font-size:16px; color:var(--accent); margin-top:25px; }
#speaker-notes li { margin-bottom:10px; }
#notes-close { float:right; }
.overline { color:var(--accent); font-size:13px; margin:0; }
dialog { max-height:85dvh; width:min(720px,calc(100vw - 32px)); border:1px solid var(--line); border-radius:12px; color:var(--fg); background:#18262d; padding:24px; }
dialog::backdrop { background:#0009; }
.dialog-head { display:flex; align-items:center; justify-content:space-between; gap:20px; }
.dialog-head h2 { font-size:24px; margin:0; }
#contents-list { padding-left:30px; }
#contents-list li { margin:6px 0; padding:0 4px; }
#contents-list button { text-align:left; border-color:transparent; width:100%; font-size:16px; }
#contents-list button[aria-current="page"] { color:var(--accent); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.no-script { position:fixed; bottom:0; color:#ffc58d; background:var(--bg); padding:12px; }
@media(max-width:800px) {
  .toolbar { height:60px; padding:0 15px; gap:12px; } .subtitle,.keyhint { display:none; }
  .tools { gap:5px; font-size:11px; } .tools button { padding:8px; }
  #stage { padding:0; height:calc(100dvh - 120px); }
  .slide { width:min(1280px,calc((100dvh - 125px)*16/9)); }
  .navigation { padding:0 16px; height:60px; gap:8px; }
  #chapter-label { min-width:0; font-size:11px; max-width:110px; } .slide-progress { margin-right:0; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
@page { size:13.333333in 7.5in; margin:0; }
@media print {
  .toolbar,.navigation,#speaker-notes,dialog,.no-script { display:none!important; }
  body { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  #stage { display:block; height:auto; padding:0; }
  .slide,.slide[hidden] { display:block!important; width:13.333333in; height:7.5in; max-width:none; break-after:page; page-break-after:always; }
  .slide:last-child { break-after:auto; page-break-after:auto; }
  .slide svg { width:100%; height:100%; }
}
</style></head>
<body><header class="toolbar"><a class="brand" href="#slide-1">Skill<span>Pilot</span></a><span class="subtitle">AI-тьютор в Telegram</span><div class="tools"><button id="contents-open" title="Оглавление (G)">Оглавление</button><button id="notes-toggle" aria-expanded="false" title="Заметки докладчика (N)">Заметки</button><button id="fullscreen" title="Полный экран (F)">Полный экран</button></div></header>
<main id="stage" aria-label="Презентация проекта"><section class="slide" id="slide-1" data-slide="1" aria-label="1. SkillPilot: AI-тьютор в Telegram"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-1 desc-1" font-family="Arial, sans-serif"><title id="title-1">SkillPilot: AI-тьютор в Telegram</title><desc id="desc-1">Представить проект как помощника для самостоятельного обучения. Он собирает исходные данные, даёт практику, оценивает ответы и сохраняет учебный маршрут. Главная демонстрация — ошибка ученика, которая меняет следующее упражнение. Презентация занимает примерно 7–8 минут, после неё остаётся время на живой показ.</desc><defs><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="70" fill="#c4ef82" font-size="16" font-weight="400" text-anchor="start">УЧЕБНЫЙ ПРОЕКТ / 2026</text><text x="72" y="245" fill="#f3f1e9" font-size="104" font-weight="600" text-anchor="start">SkillPilot</text><text x="76" y="326" fill="#f3f1e9" font-size="48" font-weight="400" text-anchor="start">AI-тьютор в Telegram</text><text x="76" y="419" fill="#a6b4ba" font-size="30" font-weight="400" text-anchor="start">Персональный план и практика</text><text x="76" y="459.5" fill="#a6b4ba" font-size="30" font-weight="400" text-anchor="start">с учётом результатов ученика</text><path d="M72 550 H1208" stroke="#415259"/><text x="76" y="596" fill="#c4ef82" font-size="24" font-weight="400" text-anchor="start">GPT-6 Luna</text><text x="380" y="596" fill="#c4ef82" font-size="24" font-weight="400" text-anchor="start">MCP</text><text x="586" y="596" fill="#c4ef82" font-size="24" font-weight="400" text-anchor="start">Память обучения</text><text x="950" y="596" fill="#c4ef82" font-size="24" font-weight="400" text-anchor="start">Напоминания</text></svg></section>
<section class="slide" id="slide-2" data-slide="2" aria-label="2. Задача и пользователь" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-2 desc-2" font-family="Arial, sans-serif"><title id="title-2">Задача и пользователь</title><desc id="desc-2">Пользователь уже мотивирован учиться, но не уверен в последовательности тем и достаточности своей практики. На примере Go цель формулируется через наблюдаемый результат — CLI-программу с корректной обработкой ввода. Это пример постановки цели, а не обещание, что любой навык можно освоить за три занятия.</desc><defs><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">01 / ЗАДАЧА</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Самостоятельное обучение</text><path d="M74 187 V404" stroke="#c4ef82" stroke-width="3"/><text x="104" y="220" fill="#f3f1e9" font-size="38" font-weight="400" text-anchor="start">«Знаю Python. Хочу освоить Go</text><text x="104" y="274" fill="#f3f1e9" font-size="38" font-weight="400" text-anchor="start">и написать первую CLI-программу.</text><text x="104" y="328" fill="#f3f1e9" font-size="38" font-weight="400" text-anchor="start">Есть 30 минут три раза в неделю».</text><text x="76" y="466" fill="#c4ef82" font-size="18" font-weight="400" text-anchor="start">Потребность</text><text x="76" y="510" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Выбрать следующий шаг</text><text x="76" y="546.45" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">и увидеть свои пробелы</text><text x="690" y="466" fill="#c4ef82" font-size="18" font-weight="400" text-anchor="start">Ожидаемый результат</text><text x="690" y="510" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Выполнить итоговую работу</text><text x="690" y="546.45" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">по понятным критериям</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Несколько навыков параллельно. У каждого свой план, занятия и прогресс.</text></svg></section>
<section class="slide" id="slide-3" data-slide="3" aria-label="3. Пользовательский путь" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-3 desc-3" font-family="Arial, sans-serif"><title id="title-3">Пользовательский путь</title><desc id="desc-3">Показать весь путь в Telegram. Цель, опыт, бюджет времени и срок вводятся последовательно. Модель создаёт диагностику, затем план. Пользователь подтверждает план, выполняет задания и видит прогресс. Напоминания включаются отдельно по желанию пользователя.</desc><defs><marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">02 / УЧЕБНЫЙ ЦИКЛ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Путь ученика в Telegram</text><g><rect x="72" y="185" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="232" y="220" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Выбор навыка</text><text x="232" y="285" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Свой профиль и цель</text></g><g><rect x="480" y="185" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="640" y="220" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Диагностика</text><text x="640" y="285" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">2–4 вопроса</text></g><g><rect x="888" y="185" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="1048" y="220" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">План</text><text x="1048" y="285" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">3–6 этапов</text></g><g><rect x="888" y="388" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="1048" y="423" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Занятие</text><text x="1048" y="488" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Объяснение и практика</text></g><g><rect x="480" y="388" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="640" y="423" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Проверка</text><text x="640" y="488" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Рубрика и обратная связь</text></g><g><rect x="72" y="388" width="320" height="120" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="232" y="423" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Следующий шаг</text><text x="232" y="488" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Переход или повторение</text></g><path d="M392 245 H476" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-3)"/><path d="M800 245 H884" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-3)"/><path d="M1048 305 V384" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-3)"/><path d="M888 448 H804" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-3)"/><path d="M480 448 H396" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-3)"/><path d="M232 508 V562 H1048 V512" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-3)"/><text x="475" y="591" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Практика продолжается до итоговой работы</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">План требует подтверждения. Прогресс и текущее задание сохраняются между сессиями.</text></svg></section>
<section class="slide" id="slide-4" data-slide="4" aria-label="4. Несколько навыков параллельно" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-4 desc-4" font-family="Arial, sans-serif"><title id="title-4">Несколько навыков параллельно</title><desc id="desc-4">Пользователь добавляет навыки командой /newskill, видит список через /skills и выбирает нужный кнопкой или /switch ID. В каждый момент обычное сообщение относится к выбранному навыку, но остальные продолжают храниться. У каждого своя диагностика, план, задание, подсказки, попытки и пауза по лимиту. Переключение обратно восстанавливает то же незавершённое задание. Завершённые навыки остаются в списке с отметкой. Числа на схеме иллюстративны, это не реальные результаты ученика.</desc><defs><marker id="arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">03 / НАВЫКИ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Несколько направлений, отдельные маршруты</text><g><rect x="72" y="184" width="340" height="94" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="242" y="219" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">Go</text><text x="242" y="258" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Выбран в диалоге</text></g><g><rect x="72" y="333" width="340" height="94" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="242" y="368" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Испанский</text><text x="242" y="407" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Сохранённое занятие</text></g><g><rect x="72" y="482" width="340" height="94" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="242" y="517" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Reinforcement Learning</text><text x="242" y="556" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Свой план и прогресс</text></g><path d="M412 231 H570" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-4)"/><g><rect x="578" y="184" width="630" height="320" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="893" y="219" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Независимая учебная сессия</text><text x="893" y="484" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Данные остальных навыков сохраняются</text></g><text x="620" y="295" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Диагностика и план</text><text x="620" y="334" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Текущее задание</text><text x="620" y="373" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">История ответов и подсказок</text><text x="620" y="412" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Прогресс и пробелы</text><text x="578" y="567" fill="#c4ef82" font-size="26" font-weight="400" text-anchor="start" font-family="monospace">/skills  /newskill  /switch ID</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">При возвращении к навыку бот продолжает с того места, где остановился ученик.</text></svg></section>
<section class="slide" id="slide-5" data-slide="5" aria-label="5. Построение учебного плана" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-5 desc-5" font-family="Arial, sans-serif"><title id="title-5">Построение учебного плана</title><desc id="desc-5">План появляется после ответа ученика на диагностику. Модель получает цель, опыт, минуты на сессию, частоту, срок, диагностические вопросы и ответ. Plan содержит диагностическую обратную связь, оценку реалистичности, этапы и итоговую работу. Каждый Module хранит ожидаемый результат, длительность и критерии успеха. Код ограничивает число этапов и отклоняет план, где занятие превышает бюджет. Связность и педагогическую обоснованность последовательности задаёт инструкция модели, а не отдельный алгоритм графа зависимостей.</desc><defs><marker id="arrow-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">04 / ПЛАН</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Профиль и диагностика задают маршрут</text><g><rect x="72" y="183" width="288" height="132" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="216" y="218" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Профиль ученика</text><text x="216" y="295" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Цель, опыт, время, срок</text></g><g><rect x="72" y="362" width="288" height="118" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="216" y="397" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Ответы диагностики</text><text x="216" y="460" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Что уже получается</text></g><path d="M360 249 H422 V319 H474" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-5)"/><path d="M360 421 H422 V319 H474" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-5)"/><g><rect x="480" y="257" width="250" height="124" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="605" y="292" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">GPT-6 Luna</text><text x="605" y="361" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Режим plan</text></g><path d="M730 319 H790" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-5)"/><text x="820" y="196" fill="#c4ef82" font-size="17" font-weight="400" text-anchor="start">УЧЕБНЫЙ ПЛАН</text><text x="820" y="240" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Результат этапа</text><text x="820" y="286" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Время занятия</text><text x="820" y="332" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Скрытые критерии</text><text x="820" y="378" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Итоговая работа</text><path d="M804 213 V396" stroke="#415259" stroke-width="2"/><text x="76" y="550" fill="#c4ef82" font-size="26" font-weight="400" text-anchor="start">Код проверяет структуру и длительность.</text><text x="76" y="587" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Модель обосновывает последовательность тем и реалистичность срока.</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Число этапов: 3–6. Последний этап по инструкции — самостоятельная итоговая работа.</text></svg></section>
<section class="slide" id="slide-6" data-slide="6" aria-label="6. Построение занятия" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-6 desc-6" font-family="Arial, sans-serif"><title id="title-6">Построение занятия</title><desc id="desc-6">Перед генерацией занятия backend читает сохранённое состояние и получает материалы через MCP. В контекст LLM входят профиль, весь план, текущий этап, фокус на пробелах и последние три попытки. Lesson содержит объяснение, другой пример, практическое задание, рубрику, эталон и три подсказки. Ученик видит объяснение, пример и задание. Рубрика и эталон остаются внутри проверки; отдельные баллы по критериям не выводятся. Эталон не выводится в чат, подсказки показываются по запросу. Ограничения длины текста и отличие примера от задания заданы в промпте. Показанная структура иллюстративна, она не является результатом живого вызова модели.</desc><defs><marker id="arrow-6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">05 / ЗАНЯТИЕ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Контекст определяет практику</text><text x="76" y="192" fill="#c4ef82" font-size="17" font-weight="400" text-anchor="start">КОНТЕКСТ МОДЕЛИ</text><text x="76" y="240" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Профиль и текущий этап</text><text x="76" y="281.6" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">План обучения</text><text x="76" y="323.2" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Пробелы ученика</text><text x="76" y="364.8" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Последние 3 попытки</text><text x="76" y="406.4" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Ссылки из каталога MCP</text><path d="M414 327 H492" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-6)"/><g><rect x="500" y="271" width="220" height="118" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="610" y="306" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">LLM</text><text x="610" y="369" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Режим lesson</text></g><path d="M720 327 H790" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-6)"/><text x="820" y="192" fill="#c4ef82" font-size="17" font-weight="400" text-anchor="start">СТРУКТУРА ЗАНЯТИЯ</text><text x="820" y="240" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Объяснение</text><text x="820" y="280.5" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Пример</text><text x="820" y="321" fill="#f3f1e9" font-size="27" font-weight="400" text-anchor="start">Задание</text><text x="820" y="442" fill="#ffc58d" font-size="23" font-weight="400" text-anchor="start">Рубрика и эталон скрыты</text><text x="820" y="482" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Подсказки доступны по запросу</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Одна сессия строится вокруг одного задания. /hint и /ask дают дополнительную помощь.</text></svg></section>
<section class="slide" id="slide-7" data-slide="7" aria-label="7. Проверка ответа" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="group" aria-labelledby="title-7 desc-7" font-family="Arial, sans-serif"><title id="title-7">Проверка ответа</title><desc id="desc-7">На слайде симулятор логики приложения с четырьмя примерными критериями Go. Нажатие 0, 1 или 2 меняет оценку критерия. Код делит сумму баллов на максимально возможную сумму и сравнивает с 80%. При четырёх критериях баллы дискретные: 6 из 8 = 75% не проходит, 7 из 8 = 87,5% проходит. Финал с любой помощью не засчитывается даже при максимальном балле. Эти интерактивные оценки задаёт докладчик, а не LLM. В настоящем сервисе модель оценивает критерии, а код требует точного совпадения списка с сохранённой рубрикой.</desc><defs><marker id="arrow-7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">06 / ПРОВЕРКА</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Рубрика и правило перехода</text><text x="76" y="169" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Служебная рубрика: ученик её не видит. Пример работает без вызова модели.</text><text x="76" y="232" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start">Проверка err != nil</text><g class="choice score-choice" role="button" tabindex="0" aria-label="Проверка err != nil: 0 из 2" aria-pressed="false" data-score-row="0" data-score-value="0"><rect x="452" y="202" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="478" y="232" text-anchor="middle" font-size="22" fill="#f3f1e9">0</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Проверка err != nil: 1 из 2" aria-pressed="false" data-score-row="0" data-score-value="1"><rect x="520" y="202" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="546" y="232" text-anchor="middle" font-size="22" fill="#f3f1e9">1</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Проверка err != nil: 2 из 2" aria-pressed="true" data-score-row="0" data-score-value="2"><rect x="588" y="202" width="52" height="44" rx="6" fill="#c4ef82" stroke="#415259"/><text x="614" y="232" text-anchor="middle" font-size="22" fill="#121b20">2</text></g><text x="76" y="299" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start">Выход при ошибке</text><g class="choice score-choice" role="button" tabindex="0" aria-label="Выход при ошибке: 0 из 2" aria-pressed="false" data-score-row="1" data-score-value="0"><rect x="452" y="269" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="478" y="299" text-anchor="middle" font-size="22" fill="#f3f1e9">0</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Выход при ошибке: 1 из 2" aria-pressed="true" data-score-row="1" data-score-value="1"><rect x="520" y="269" width="52" height="44" rx="6" fill="#c4ef82" stroke="#415259"/><text x="546" y="299" text-anchor="middle" font-size="22" fill="#121b20">1</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Выход при ошибке: 2 из 2" aria-pressed="false" data-score-row="1" data-score-value="2"><rect x="588" y="269" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="614" y="299" text-anchor="middle" font-size="22" fill="#f3f1e9">2</text></g><text x="76" y="366" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start">Работа с результатом</text><g class="choice score-choice" role="button" tabindex="0" aria-label="Работа с результатом: 0 из 2" aria-pressed="true" data-score-row="2" data-score-value="0"><rect x="452" y="336" width="52" height="44" rx="6" fill="#c4ef82" stroke="#415259"/><text x="478" y="366" text-anchor="middle" font-size="22" fill="#121b20">0</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Работа с результатом: 1 из 2" aria-pressed="false" data-score-row="2" data-score-value="1"><rect x="520" y="336" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="546" y="366" text-anchor="middle" font-size="22" fill="#f3f1e9">1</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Работа с результатом: 2 из 2" aria-pressed="false" data-score-row="2" data-score-value="2"><rect x="588" y="336" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="614" y="366" text-anchor="middle" font-size="22" fill="#f3f1e9">2</text></g><text x="76" y="433" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start">Объяснение решения</text><g class="choice score-choice" role="button" tabindex="0" aria-label="Объяснение решения: 0 из 2" aria-pressed="false" data-score-row="3" data-score-value="0"><rect x="452" y="403" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="478" y="433" text-anchor="middle" font-size="22" fill="#f3f1e9">0</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Объяснение решения: 1 из 2" aria-pressed="true" data-score-row="3" data-score-value="1"><rect x="520" y="403" width="52" height="44" rx="6" fill="#c4ef82" stroke="#415259"/><text x="546" y="433" text-anchor="middle" font-size="22" fill="#121b20">1</text></g><g class="choice score-choice" role="button" tabindex="0" aria-label="Объяснение решения: 2 из 2" aria-pressed="false" data-score-row="3" data-score-value="2"><rect x="588" y="403" width="52" height="44" rx="6" fill="#1b2a30" stroke="#415259"/><text x="614" y="433" text-anchor="middle" font-size="22" fill="#f3f1e9">2</text></g><path d="M698 200 V553" stroke="#415259"/><text x="755" y="228" fill="#a6b4ba" font-size="23" font-weight="400" text-anchor="start">Сумма / (2 × число критериев)</text><text id="score-value" x="755" y="322" fill="#ffc58d" font-size="78">50%</text><text id="score-status" x="755" y="373" fill="#ffc58d" font-size="28">Дополнительная практика</text><text id="score-reason" x="755" y="412" fill="#a6b4ba" font-size="21">4 из 8 баллов, порог — 80%</text><g class="choice toggle-choice" role="button" tabindex="0" aria-pressed="false" aria-label="Итоговая работа" data-toggle="final"><rect x="76" y="516" width="260" height="50" rx="6" fill="#1b2a30" stroke="#415259"/><text x="96" y="549" fill="#f3f1e9" font-size="21" font-weight="400" text-anchor="start">Итоговая работа</text></g><g class="choice toggle-choice" role="button" tabindex="0" aria-pressed="false" aria-label="Была помощь" data-toggle="help"><rect x="367" y="516" width="260" height="50" rx="6" fill="#1b2a30" stroke="#415259"/><text x="387" y="549" fill="#f3f1e9" font-size="21" font-weight="400" text-anchor="start">Была помощь</text></g><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Ученик видит общую оценку и объяснение ошибок. Рубрика остаётся внутри проверки.</text></svg></section>
<section class="slide" id="slide-8" data-slide="8" aria-label="8. Адаптация обучения" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-8 desc-8" font-family="Arial, sans-serif"><title id="title-8">Адаптация обучения</title><desc id="desc-8">При ошибке backend сохраняет Attempt, список gaps и запись в adaptations. Текущий индекс этапа остаётся прежним, старое задание освобождается, а новое получает фокус на пробелах. План в MVP корректируется добавлением целевой практики. Перестроение порядка всех тем и интервальное повторение оставлены для следующей версии. Успешный ответ переводит к следующему этапу. Если это последняя работа и помощь не использовалась, состояние становится done.</desc><defs><marker id="arrow-8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">07 / АДАПТАЦИЯ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Результат проверки меняет следующий шаг</text><g><rect x="430" y="177" width="420" height="92" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="640" y="212" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Ответ оценён</text><text x="640" y="249" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Рубрика сохранена</text></g><path d="M534 269 V315 H258 V350" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-8)"/><path d="M746 269 V315 H1020 V350" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-8)"/><text x="267" y="300" fill="#ffc58d" font-size="19" font-weight="400" text-anchor="middle">Балл ниже 80% или финал с помощью</text><text x="1013" y="300" fill="#c4ef82" font-size="19" font-weight="400" text-anchor="middle">Условие прохождения выполнено</text><g><rect x="72" y="356" width="390" height="111" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="267" y="391" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Сохранить пробелы</text><text x="267" y="447" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">gaps → focus</text></g><g><rect x="818" y="356" width="390" height="111" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="1013" y="391" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">Перейти к следующему этапу</text><text x="1013" y="447" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">module_index + 1</text></g><path d="M267 467 V506" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-8)"/><path d="M1013 467 V506" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-8)"/><text x="76" y="548" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">Новое задание на том же этапе</text><text x="76" y="583.1" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">с учётом последней ошибки</text><text x="823" y="548" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">После итоговой работы:</text><text x="823" y="583.1" fill="#f3f1e9" font-size="26" font-weight="400" text-anchor="start">цель выполнена по плану</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">MVP адаптирует практику. Полное перестроение программы — следующая итерация.</text></svg></section>
<section class="slide" id="slide-9" data-slide="9" aria-label="9. Техническая архитектура" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-9 desc-9" font-family="Arial, sans-serif"><title id="title-9">Техническая архитектура</title><desc id="desc-9">Пользователь общается с Telegram. aiogram получает сообщения через long polling. Учебный workflow вызывает Responses API GPT-6 Luna и инструменты MCP. MCP работает отдельным дочерним процессом через stdio и обращается к SQLite и локальному каталогу материалов. Планировщик — фоновая задача в основном процессе; он получает расписание через MCP и отправляет сообщения через Bot API. Кнопка на слайде подсвечивает последовательность обращения, это схема архитектуры, а не сетевой запрос.</desc><defs><marker id="arrow-9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">08 / АРХИТЕКТУРА</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Telegram, учебный workflow и MCP</text><g id="arch-user" class="arch-node"><g><rect x="72" y="213" width="200" height="108" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="172" y="248" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Ученик</text><text x="172" y="301" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Telegram</text></g></g><g id="arch-telegram" class="arch-node"><g><rect x="337" y="213" width="240" height="108" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="457" y="248" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">aiogram</text><text x="457" y="301" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Long polling</text></g></g><g id="arch-engine" class="arch-node"><g><rect x="642" y="213" width="280" height="108" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="782" y="248" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">Учебный workflow</text><text x="782" y="301" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Переходы и валидация</text></g></g><g id="arch-mcp" class="arch-node"><g><rect x="642" y="422" width="280" height="108" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="782" y="457" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Learning MCP</text><text x="782" y="510" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Отдельный subprocess</text></g></g><g id="arch-model" class="arch-node"><g><rect x="992" y="213" width="216" height="108" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="1100" y="248" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">GPT-6 Luna</text><text x="1100" y="301" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Responses API</text></g></g><g id="arch-data" class="arch-node"><g><rect x="992" y="422" width="216" height="108" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="1100" y="457" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Данные</text><text x="1100" y="510" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">SQLite + каталог</text></g></g><path d="M272 267 H333" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-9)"/><path d="M577 267 H638" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-9)"/><path d="M922 267 H988" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-9)"/><path d="M782 321 V418" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-9)"/><path d="M922 476 H988" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-9)"/><text x="790" y="376" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="start">stdio</text><text x="76" y="435" fill="#c4ef82" font-size="24" font-weight="400" text-anchor="start">Планировщик напоминаний</text><text x="76" y="475" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Читает расписание через MCP</text><text x="76" y="510" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Отправляет сообщения через Bot API</text><g role="button" tabindex="0" class="choice" data-arch-next="true" aria-label="Показать следующий шаг сценария"><rect x="72" y="563" width="236" height="42" rx="6" fill="#1b2a30" stroke="#415259"/><text x="92" y="591" fill="#c4ef82" font-size="20" font-weight="400" text-anchor="start">Показать сценарий</text></g><text id="arch-description" x="337" y="590" fill="#a6b4ba" font-size="18">Нажмите кнопку, чтобы пройти путь запроса</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Учебные данные доступны через MCP. Расход модели хранится в отдельном ledger бюджета.</text></svg></section>
<section class="slide" id="slide-10" data-slide="10" aria-label="10. MCP: назначение и инструменты" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-10 desc-10" font-family="Arial, sans-serif"><title id="title-10">MCP: назначение и инструменты</title><desc id="desc-10">MCP — Model Context Protocol, интерфейс между приложением и сервером инструментов. В проекте используется официальный Python SDK и транспорт stdio. Backend выступает MCP-клиентом и вызывает tools/list и tools/call. Сервер предоставляет управление навыками, учебным состоянием, материалами и расписанием. Это отдельный приватный процесс. Решение, какой инструмент вызвать, принимает учебный workflow, а не LLM. User ID берётся из Telegram; switch_skill проверяет принадлежность навыка. Если сервер выносить в сеть, потребуется отдельная аутентификация.</desc><defs><marker id="arrow-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">09 / MCP</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Единый интерфейс к учебным данным</text><g><rect x="72" y="184" width="280" height="105" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="212" y="219" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Backend</text><text x="212" y="269" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">MCP client</text></g><g><rect x="465" y="184" width="350" height="105" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="640" y="219" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">Learning MCP Server</text><text x="640" y="269" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Инструменты и валидация</text></g><g><rect x="928" y="184" width="280" height="105" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="1068" y="219" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Данные</text><text x="1068" y="269" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">SQLite и каталог</text></g><path d="M352 236 H461" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-10)"/><path d="M815 236 H924" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-10)"/><text x="365" y="218" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">stdio</text><text x="76" y="370" fill="#c4ef82" font-size="25" font-weight="400" text-anchor="start">Управление навыками</text><text x="76" y="421" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">list_skills</text><text x="76" y="460.6" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">create_skill</text><text x="76" y="500.2" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">switch_skill</text><text x="640" y="370" fill="#c4ef82" font-size="25" font-weight="400" text-anchor="start">Учебные данные и материалы</text><text x="640" y="421" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">get_learning_state</text><text x="640" y="460.6" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">save_learning_state</text><text x="640" y="500.2" fill="#f3f1e9" font-size="24" font-weight="400" text-anchor="start" font-family="monospace">search_materials</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">User ID задаёт приложение. MCP проверяет владельца навыка и версию выбранной сессии.</text></svg></section>
<section class="slide" id="slide-11" data-slide="11" aria-label="11. MCP: сквозной сценарий" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-11 desc-11" font-family="Arial, sans-serif"><title id="title-11">MCP: сквозной сценарий</title><desc id="desc-11">Разобрать /lesson как реальный сквозной сценарий. Backend сначала запрашивает состояние, затем материалы. Эти вызовы выполняются через официальный MCP Python SDK, с initialize и tools/call. Далее модель создаёт структурированный Lesson. После проверки Pydantic backend вызывает save_learning_state с ожидаемой revision. Только после успешной записи ученик получает занятие. MCP не вызывается моделью автономно: последовательность определяет код. Приватный stdio-сервер не имеет сетевой авторизации и не должен напрямую публиковаться наружу.</desc><defs><marker id="arrow-11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">10 / MCP</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Что происходит после /lesson</text><text x="140" y="181" fill="#f3f1e9" font-size="21" font-weight="400" text-anchor="middle">Telegram</text><path d="M140 202 V574" fill="none" stroke="#415259" stroke-width="2" stroke-dasharray="7 6"/><text x="480" y="181" fill="#f3f1e9" font-size="21" font-weight="400" text-anchor="middle">Backend</text><path d="M480 202 V574" fill="none" stroke="#415259" stroke-width="2" stroke-dasharray="7 6"/><text x="830" y="181" fill="#c4ef82" font-size="21" font-weight="400" text-anchor="middle">MCP</text><path d="M830 202 V574" fill="none" stroke="#415259" stroke-width="2" stroke-dasharray="7 6"/><text x="1140" y="181" fill="#f3f1e9" font-size="21" font-weight="400" text-anchor="middle">LLM</text><path d="M1140 202 V574" fill="none" stroke="#415259" stroke-width="2" stroke-dasharray="7 6"/><path d="M140 236 H480" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="154" y="226" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">1. /lesson</text><path d="M480 294 H830" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="494" y="284" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">2. get_learning_state</text><path d="M830 312 H480" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-11)"/><path d="M480 352 H830" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="494" y="342" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">3. search_materials</text><path d="M830 370 H480" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-11)"/><path d="M480 410 H1140" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="494" y="400" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">4. generate → Lesson</text><path d="M1140 428 H480" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-11)"/><path d="M480 468 H830" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="494" y="458" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">5. save_learning_state + revision</text><path d="M830 486 H480" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-11)"/><path d="M480 526 H140" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-11)"/><text x="154" y="516" fill="#f3f1e9" font-size="18" font-weight="400" text-anchor="start">6. Занятие в чате</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Сплошные линии — запросы, пунктир — ответы. Код валидирует и сохраняет занятие до выдачи.</text></svg></section>
<section class="slide" id="slide-12" data-slide="12" aria-label="12. Память и согласованность" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-12 desc-12" font-family="Arial, sans-serif"><title id="title-12">Память и согласованность</title><desc id="desc-12">Учебная база содержит learners, skills и reminders. learners хранит общую revision и active_skill_id. skills хранит отдельный JSON-снимок каждого навыка, связанный с user_id. Переключение меняет только указатель и revision, сохраняя незавершённые задания. Старая одноцелевая база автоматически переносится в первый навык в транзакции. Напоминания общие на пользователя. Расход модели хранится отдельно в budget.sqlite3. Проверка ownership исключает доступ к чужому навыку, а общая revision отклоняет кнопки от прежнего выбора.</desc><defs><marker id="arrow-12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">11 / ДАННЫЕ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Каждый навык хранит свой прогресс</text><text x="76" y="210" fill="#c4ef82" font-size="29" font-weight="400" text-anchor="start" font-family="monospace">learners</text><text x="76" y="280" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start" font-family="monospace">user_id</text><text x="76" y="323.7" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start" font-family="monospace">revision</text><text x="76" y="367.4" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start" font-family="monospace">active_skill_id</text><text x="470" y="210" fill="#c4ef82" font-size="29" font-weight="400" text-anchor="start" font-family="monospace">skills</text><text x="470" y="280" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start" font-family="monospace">skill_id, user_id</text><text x="470" y="323.7" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start" font-family="monospace">state (JSON)</text><text x="470" y="390" fill="#a6b4ba" font-size="23" font-weight="400" text-anchor="start">План, задание, ответы,</text><text x="470" y="421.05" fill="#a6b4ba" font-size="23" font-weight="400" text-anchor="start">подсказки и пробелы</text><text x="910" y="210" fill="#c4ef82" font-size="29" font-weight="400" text-anchor="start" font-family="monospace">reminders</text><text x="910" y="280" fill="#f3f1e9" font-size="22" font-weight="400" text-anchor="start">user_id</text><text x="910" y="321.8" fill="#f3f1e9" font-size="22" font-weight="400" text-anchor="start">Расписание</text><text x="910" y="363.6" fill="#f3f1e9" font-size="22" font-weight="400" text-anchor="start">next_due + lease</text><path d="M365 200 H440" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-12)"/><path d="M72 475 H1208" stroke="#415259"/><text x="76" y="521" fill="#f3f1e9" font-size="28" font-weight="400" text-anchor="start">Переключение навыка меняет общую revision.</text><text x="76" y="568" fill="#a6b4ba" font-size="25" font-weight="400" text-anchor="start">Старая кнопка не сможет отправить ответ в другой навык.</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">При обновлении существующая цель и незавершённое занятие переносятся в первый навык.</text></svg></section>
<section class="slide" id="slide-13" data-slide="13" aria-label="13. Напоминания" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-13 desc-13" font-family="Arial, sans-serif"><title id="title-13">Напоминания</title><desc id="desc-13">Уведомления не зависят от решения LLM. Пользователь выбирает время, часовой пояс и дни недели. Планировщик проверяет расписание с периодом 30 секунд. MCP выдаёт due-запись с lease на пять минут, бот отправляет сообщение и подтверждает доставку. 429 вызывает retry, блокировка бота отключает напоминания, сообщение предлагает выбрать один из незавершённых навыков, а завершение всех навыков прекращает отправку. Старые сообщения больше двух часов пропускаются. После падения между отправкой и подтверждением возможен дубль, поэтому строго exactly-once не заявляем.</desc><defs><marker id="arrow-13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">12 / НАПОМИНАНИЯ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Расписание хранится отдельно от диалога</text><text x="76" y="186" fill="#c4ef82" font-size="28" font-weight="400" text-anchor="start" font-family="monospace">/remind 19:00 Europe/Moscow 1,3,5</text><g><rect x="72" y="247" width="250" height="110" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="197" y="282" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Расписание</text><text x="197" y="337" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Время, дни, timezone</text></g><g><rect x="397" y="247" width="260" height="110" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="527" y="282" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">SQLite через MCP</text><text x="527" y="337" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">next_due + lease</text></g><g><rect x="732" y="247" width="250" height="110" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="857" y="282" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Bot API</text><text x="857" y="337" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">sendMessage</text></g><path d="M322 302 H393" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-13)"/><path d="M657 302 H728" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-13)"/><path d="M857 357 V404 H527 V361" fill="none" stroke="#a6b4ba" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-13)"/><text x="580" y="434" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">Подтверждение или повторная попытка</text><text x="76" y="504" fill="#c4ef82" font-size="19" font-weight="400" text-anchor="start">Управление ученика</text><text x="76" y="546" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">Выбрать навык</text><text x="76" y="579.75" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">Перенести или отключить</text><text x="720" y="504" fill="#c4ef82" font-size="19" font-weight="400" text-anchor="start">Работа сервера</text><text x="720" y="546" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">Проверка каждые 30 секунд</text><text x="720" y="579.75" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">Сохранение после перезапуска</text><path d="M72 630 H1208" stroke="#415259"/><text x="72" y="667" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">При падении между отправкой и подтверждением возможен повтор уведомления.</text></svg></section>
<section class="slide" id="slide-14" data-slide="14" aria-label="14. Развёртывание и границы MVP" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title-14 desc-14" font-family="Arial, sans-serif"><title id="title-14">Развёртывание и границы MVP</title><desc id="desc-14">Для эксплуатации предусмотрен один Docker-контейнер, постоянный named volume и исходящий HTTPS. Домен и входящий порт для long polling не нужны. Бот, фоновый планировщик и дочерний MCP запускаются на постоянном сервере. Подготовлены Dockerfile, Compose и CI, но развёртывание и сборка на целевом хосте требуют проверки. Доступ к модели подтверждён живой диагностикой и Eval от 28.10.2026: 19 из 20 оценок попали в ожидаемый диапазон. До защиты нужно проверить постоянный хостинг, опубликовать подготовленный репозиторий и продемонстрировать работающего бота. Ограничения MVP: текстовая проверка, отсутствие исполнения кода, одна модель для генерации и оценивания.</desc><defs><marker id="arrow-14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4ba"/></marker></defs><rect width="1280" height="720" fill="#121b20"/><text x="72" y="57" fill="#c4ef82" font-size="15" font-weight="500" text-anchor="start">13 / РАЗВЁРТЫВАНИЕ</text><text x="72" y="119" fill="#f3f1e9" font-size="48" font-weight="500" text-anchor="start">Один сервис на постоянном сервере</text><g><rect x="72" y="187" width="665" height="250" rx="10" fill="#1b2a30" stroke="#c4ef82" stroke-width="2"/><text x="404.5" y="222" fill="#c4ef82" font-size="22" font-weight="500" text-anchor="middle">Docker-контейнер</text><text x="404.5" y="417" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">Telegram polling + workflow + scheduler + MCP</text></g><text x="110" y="300" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">Python 3.12 / aiogram / Pydantic</text><text x="110" y="350" fill="#f3f1e9" font-size="25" font-weight="400" text-anchor="start">OpenAI SDK / официальный MCP SDK</text><text x="110" y="391" fill="#a6b4ba" font-size="19" font-weight="400" text-anchor="start">SDD: спецификация, план задач, проверки</text><path d="M404 437 V492" fill="none" stroke="#a6b4ba" stroke-width="2" marker-end="url(#arrow-14)"/><g><rect x="221" y="498" width="366" height="87" rx="10" fill="#1b2a30" stroke="#415259" stroke-width="1"/><text x="404" y="533" fill="#f3f1e9" font-size="22" font-weight="500" text-anchor="middle">Persistent volume</text><text x="404" y="565" fill="#a6b4ba" font-size="17" font-weight="400" text-anchor="middle">SQLite и heartbeat</text></g><text x="807" y="217" fill="#c4ef82" font-size="17" font-weight="400" text-anchor="start">ПОДГОТОВЛЕНО</text><text x="807" y="259" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start">Код, тесты, Docker, CI</text><text x="807" y="290.05" fill="#f3f1e9" font-size="23" font-weight="400" text-anchor="start">README и live Eval</text><path d="M72 630 H1208" stroke="#415259"/></svg></section></main>

<script id="deck-data" type="application/json">[{"id":1,"title":"SkillPilot: AI-тьютор в Telegram","chapter":"Проект","seconds":20,"notes":"Представить проект как помощника для самостоятельного обучения. Он собирает исходные данные, даёт практику, оценивает ответы и сохраняет учебный маршрут. Главная демонстрация — ошибка ученика, которая меняет следующее упражнение. Презентация занимает примерно 7–8 минут, после неё остаётся время на живой показ.","sources":[{"label":"README","href":"../README.md"},{"label":"Спецификация","href":"../docs/spec.md"}]},{"id":2,"title":"Задача и пользователь","chapter":"Сценарий","seconds":30,"notes":"Пользователь уже мотивирован учиться, но не уверен в последовательности тем и достаточности своей практики. На примере Go цель формулируется через наблюдаемый результат — CLI-программу с корректной обработкой ввода. Это пример постановки цели, а не обещание, что любой навык можно освоить за три занятия.","sources":[{"label":"Постановка задачи","href":"../docs/spec.md"},{"label":"Сбор профиля","href":"../tutor/engine.py"}]},{"id":3,"title":"Пользовательский путь","chapter":"Учебный цикл","seconds":25,"notes":"Показать весь путь в Telegram. Цель, опыт, бюджет времени и срок вводятся последовательно. Модель создаёт диагностику, затем план. Пользователь подтверждает план, выполняет задания и видит прогресс. Напоминания включаются отдельно по желанию пользователя.","sources":[{"label":"Машина состояний","href":"../tutor/engine.py"},{"label":"LearningState","href":"../tutor/models.py"}]},{"id":4,"title":"Несколько навыков параллельно","chapter":"Учебный цикл","seconds":30,"notes":"Пользователь добавляет навыки командой /newskill, видит список через /skills и выбирает нужный кнопкой или /switch ID. В каждый момент обычное сообщение относится к выбранному навыку, но остальные продолжают храниться. У каждого своя диагностика, план, задание, подсказки, попытки и пауза по лимиту. Переключение обратно восстанавливает то же незавершённое задание. Завершённые навыки остаются в списке с отметкой. Числа на схеме иллюстративны, это не реальные результаты ученика.","sources":[{"label":"Команды навыков","href":"../tutor/engine.py"},{"label":"Хранение и выбор","href":"../tutor/storage.py"},{"label":"Кнопки Telegram","href":"../tutor/telegram.py"}]},{"id":5,"title":"Построение учебного плана","chapter":"Учебная логика","seconds":40,"notes":"План появляется после ответа ученика на диагностику. Модель получает цель, опыт, минуты на сессию, частоту, срок, диагностические вопросы и ответ. Plan содержит диагностическую обратную связь, оценку реалистичности, этапы и итоговую работу. Каждый Module хранит ожидаемый результат, длительность и критерии успеха. Код ограничивает число этапов и отклоняет план, где занятие превышает бюджет. Связность и педагогическую обоснованность последовательности задаёт инструкция модели, а не отдельный алгоритм графа зависимостей.","sources":[{"label":"Генерация plan","href":"../tutor/llm.py"},{"label":"Проверка бюджета","href":"../tutor/engine.py"},{"label":"Plan и Module","href":"../tutor/models.py"}]},{"id":6,"title":"Построение занятия","chapter":"Учебная логика","seconds":35,"notes":"Перед генерацией занятия backend читает сохранённое состояние и получает материалы через MCP. В контекст LLM входят профиль, весь план, текущий этап, фокус на пробелах и последние три попытки. Lesson содержит объяснение, другой пример, практическое задание, рубрику, эталон и три подсказки. Ученик видит объяснение, пример и задание. Рубрика и эталон остаются внутри проверки; отдельные баллы по критериям не выводятся. Эталон не выводится в чат, подсказки показываются по запросу. Ограничения длины текста и отличие примера от задания заданы в промпте. Показанная структура иллюстративна, она не является результатом живого вызова модели.","sources":[{"label":"Сбор контекста lesson","href":"../tutor/engine.py"},{"label":"Lesson","href":"../tutor/models.py"},{"label":"Инструкция занятия","href":"../tutor/llm.py"}]},{"id":7,"title":"Проверка ответа","chapter":"Оценивание","seconds":40,"notes":"На слайде симулятор логики приложения с четырьмя примерными критериями Go. Нажатие 0, 1 или 2 меняет оценку критерия. Код делит сумму баллов на максимально возможную сумму и сравнивает с 80%. При четырёх критериях баллы дискретные: 6 из 8 = 75% не проходит, 7 из 8 = 87,5% проходит. Финал с любой помощью не засчитывается даже при максимальном балле. Эти интерактивные оценки задаёт докладчик, а не LLM. В настоящем сервисе модель оценивает критерии, а код требует точного совпадения списка с сохранённой рубрикой.","sources":[{"label":"grade_score и passed","href":"../tutor/engine.py"},{"label":"Grade","href":"../tutor/models.py"},{"label":"Инструкция grade","href":"../tutor/llm.py"}]},{"id":8,"title":"Адаптация обучения","chapter":"Учебная логика","seconds":35,"notes":"При ошибке backend сохраняет Attempt, список gaps и запись в adaptations. Текущий индекс этапа остаётся прежним, старое задание освобождается, а новое получает фокус на пробелах. План в MVP корректируется добавлением целевой практики. Перестроение порядка всех тем и интервальное повторение оставлены для следующей версии. Успешный ответ переводит к следующему этапу. Если это последняя работа и помощь не использовалась, состояние становится done.","sources":[{"label":"Ветка passed / gaps","href":"../tutor/engine.py"},{"label":"Attempt и LearningState","href":"../tutor/models.py"}]},{"id":9,"title":"Техническая архитектура","chapter":"Техническое описание","seconds":40,"notes":"Пользователь общается с Telegram. aiogram получает сообщения через long polling. Учебный workflow вызывает Responses API GPT-6 Luna и инструменты MCP. MCP работает отдельным дочерним процессом через stdio и обращается к SQLite и локальному каталогу материалов. Планировщик — фоновая задача в основном процессе; он получает расписание через MCP и отправляет сообщения через Bot API. Кнопка на слайде подсвечивает последовательность обращения, это схема архитектуры, а не сетевой запрос.","sources":[{"label":"Запуск процессов","href":"../tutor/main.py"},{"label":"MCP client","href":"../tutor/mcp_client.py"},{"label":"Telegram","href":"../tutor/telegram.py"}]},{"id":10,"title":"MCP: назначение и инструменты","chapter":"Техническое описание","seconds":35,"notes":"MCP — Model Context Protocol, интерфейс между приложением и сервером инструментов. В проекте используется официальный Python SDK и транспорт stdio. Backend выступает MCP-клиентом и вызывает tools/list и tools/call. Сервер предоставляет управление навыками, учебным состоянием, материалами и расписанием. Это отдельный приватный процесс. Решение, какой инструмент вызвать, принимает учебный workflow, а не LLM. User ID берётся из Telegram; switch_skill проверяет принадлежность навыка. Если сервер выносить в сеть, потребуется отдельная аутентификация.","sources":[{"label":"MCP server: инструменты","href":"../tutor/mcp_server.py"},{"label":"MCP client","href":"../tutor/mcp_client.py"},{"label":"Официальный MCP Python SDK","href":"https://github.com/modelcontextprotocol/python-sdk"}]},{"id":11,"title":"MCP: сквозной сценарий","chapter":"Техническое описание","seconds":35,"notes":"Разобрать /lesson как реальный сквозной сценарий. Backend сначала запрашивает состояние, затем материалы. Эти вызовы выполняются через официальный MCP Python SDK, с initialize и tools/call. Далее модель создаёт структурированный Lesson. После проверки Pydantic backend вызывает save_learning_state с ожидаемой revision. Только после успешной записи ученик получает занятие. MCP не вызывается моделью автономно: последовательность определяет код. Приватный stdio-сервер не имеет сетевой авторизации и не должен напрямую публиковаться наружу.","sources":[{"label":"Протокол MCP","href":"../tutor/mcp_client.py"},{"label":"Инструменты","href":"../tutor/mcp_server.py"},{"label":"/lesson","href":"../tutor/engine.py"}]},{"id":12,"title":"Память и согласованность","chapter":"Техническое описание","seconds":25,"notes":"Учебная база содержит learners, skills и reminders. learners хранит общую revision и active_skill_id. skills хранит отдельный JSON-снимок каждого навыка, связанный с user_id. Переключение меняет только указатель и revision, сохраняя незавершённые задания. Старая одноцелевая база автоматически переносится в первый навык в транзакции. Напоминания общие на пользователя. Расход модели хранится отдельно в budget.sqlite3. Проверка ownership исключает доступ к чужому навыку, а общая revision отклоняет кнопки от прежнего выбора.","sources":[{"label":"Миграция и навыки","href":"../tutor/storage.py"},{"label":"Состояние навыка","href":"../tutor/models.py"},{"label":"Ledger расхода","href":"../tutor/budget.py"}]},{"id":13,"title":"Напоминания","chapter":"Техническое описание","seconds":30,"notes":"Уведомления не зависят от решения LLM. Пользователь выбирает время, часовой пояс и дни недели. Планировщик проверяет расписание с периодом 30 секунд. MCP выдаёт due-запись с lease на пять минут, бот отправляет сообщение и подтверждает доставку. 429 вызывает retry, блокировка бота отключает напоминания, сообщение предлагает выбрать один из незавершённых навыков, а завершение всех навыков прекращает отправку. Старые сообщения больше двух часов пропускаются. После падения между отправкой и подтверждением возможен дубль, поэтому строго exactly-once не заявляем.","sources":[{"label":"Планировщик","href":"../tutor/reminders.py"},{"label":"Расписание и DST","href":"../tutor/scheduling.py"},{"label":"Lease и подтверждение","href":"../tutor/storage.py"}]},{"id":14,"title":"Развёртывание и границы MVP","chapter":"Готовность проекта","seconds":25,"notes":"Для эксплуатации предусмотрен один Docker-контейнер, постоянный named volume и исходящий HTTPS. Домен и входящий порт для long polling не нужны. Бот, фоновый планировщик и дочерний MCP запускаются на постоянном сервере. Подготовлены Dockerfile, Compose и CI, но развёртывание и сборка на целевом хосте требуют проверки. Доступ к модели подтверждён живой диагностикой и Eval от 28.10.2026: 19 из 20 оценок попали в ожидаемый диапазон. До защиты нужно проверить постоянный хостинг, опубликовать подготовленный репозиторий и продемонстрировать работающего бота. Ограничения MVP: текстовая проверка, отсутствие исполнения кода, одна модель для генерации и оценивания.","sources":[{"label":"Docker Compose","href":"../compose.yaml"},{"label":"Dockerfile","href":"../Dockerfile"},{"label":"SDD и задачи","href":"../docs/plan.md"},{"label":"Спецификация","href":"../docs/spec.md"}]}]</script><script>/* No network, dependencies or API keys. Interactive examples illustrate backend rules. */
function calculateAssessment(scores, finalWork, usedHelp) {
  if (!scores.length || scores.some(score => !Number.isInteger(score) || score < 0 || score > 2)) {
    throw new RangeError('Scores must be integers from 0 to 2');
  }
  const total = scores.reduce((sum, score) => sum + score, 0);
  const max = 2 * scores.length;
  const score = total / max;
  return { total, max, score, passed:score >= 0.8 && !(finalWork && usedHelp) };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { calculateAssessment };
}

if (typeof document !== 'undefined') {
  (() => {
    const deck = JSON.parse(document.getElementById('deck-data').textContent);
    const sections = [...document.querySelectorAll('section[data-slide]')];
    const contents = document.getElementById('contents-dialog');
    const notes = document.getElementById('speaker-notes');
    const live = document.getElementById('live-status');
    const list = document.getElementById('contents-list');
    const scores = [2,1,0,1];
    let finalWork = false;
    let usedHelp = false;
    let current = 0;
    let archStep = -1;
    const arch = [
      ['user','1. Ученик отправляет сообщение в Telegram.'],
      ['telegram','2. aiogram передаёт личное сообщение в учебный workflow.'],
      ['mcp','3. Backend получает состояние и материалы через MCP.'],
      ['model','4. GPT-6 Luna возвращает структурированный ответ.'],
      ['engine','5. Код проверяет результат и правило перехода.'],
      ['data','6. MCP сохраняет данные с проверкой revision.'],
      ['telegram','7. Ученик получает занятие или обратную связь в чате.'],
    ];

    deck.forEach((slide,index) => {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.textContent = slide.title;
      button.addEventListener('click',() => { show(index); contents.close(); });
      item.append(button); list.append(item);
    });

    function renderNotes() {
      const slide = deck[current];
      document.getElementById('notes-title').textContent = slide.title;
      document.getElementById('notes-time').textContent = `Слайд ${current+1} · ориентир ${slide.seconds} сек`;
      document.getElementById('notes-text').textContent = slide.notes;
      const sources = document.getElementById('notes-sources');
      sources.replaceChildren();
      slide.sources.forEach(source => {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.textContent = source.label;
        link.href = source.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        item.append(link); sources.append(item);
      });
    }

    function show(index, updateHash=true) {
      current = Math.max(0,Math.min(sections.length-1,index));
      sections.forEach((section,i) => { section.hidden = i !== current; });
      document.getElementById('counter').textContent = `${current+1} / ${sections.length}`;
      document.getElementById('chapter-label').textContent = deck[current].chapter;
      document.getElementById('deck-progress').style.width = `${(current+1)/sections.length*100}%`;
      document.getElementById('previous').disabled = current === 0;
      document.getElementById('next').disabled = current === sections.length-1;
      [...list.querySelectorAll('button')].forEach((button,i) => {
        if (i === current) button.setAttribute('aria-current','page');
        else button.removeAttribute('aria-current');
      });
      renderNotes();
      live.textContent = `Слайд ${current+1}: ${deck[current].title}`;
      if (updateHash) history.replaceState(null,'',`#slide-${current+1}`);
    }

    function fromHash() {
      const match = location.hash.match(/^#slide-(\d+)$/);
      const index = match ? Number(match[1])-1 : 0;
      show(index,false);
    }

    function toggleNotes(force) {
      notes.hidden = typeof force === 'boolean' ? !force : !notes.hidden;
      document.getElementById('notes-toggle').setAttribute('aria-expanded',String(!notes.hidden));
    }

    function updateAssessment() {
      const result = calculateAssessment(scores,finalWork,usedHelp);
      document.querySelectorAll('.score-choice').forEach(choice => {
        const selected = scores[Number(choice.getAttribute('data-score-row'))] === Number(choice.getAttribute('data-score-value'));
        choice.setAttribute('aria-pressed',String(selected));
        choice.querySelector('rect').setAttribute('fill',selected ? '#c4ef82' : '#1b2a30');
        choice.querySelector('text').setAttribute('fill',selected ? '#121b20' : '#f3f1e9');
      });
      const color = result.passed ? '#c4ef82' : '#ffc58d';
      const value = document.getElementById('score-value');
      value.textContent = new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(result.score);
      value.setAttribute('fill',color);
      const status = document.getElementById('score-status');
      status.textContent = result.passed ? 'Переход к следующему этапу' : 'Дополнительная практика';
      status.setAttribute('fill',color);
      document.getElementById('score-reason').textContent = finalWork && usedHelp
        ? 'Для финала нужно решение без помощи'
        : `${result.total} из ${result.max} баллов, порог — 80%`;
      live.textContent = `${value.textContent}. ${status.textContent}.`;
    }

    function activateControl(element) {
      if (element.hasAttribute('data-score-row')) {
        scores[Number(element.getAttribute('data-score-row'))] = Number(element.getAttribute('data-score-value'));
        updateAssessment();
      } else if (element.hasAttribute('data-toggle')) {
        if (element.getAttribute('data-toggle') === 'final') finalWork = !finalWork;
        else usedHelp = !usedHelp;
        element.setAttribute('aria-pressed',String(element.getAttribute('data-toggle') === 'final' ? finalWork : usedHelp));
        updateAssessment();
      } else if (element.hasAttribute('data-arch-next')) {
        archStep = (archStep+1)%arch.length;
        document.querySelectorAll('.arch-node').forEach(node => node.classList.remove('active'));
        document.getElementById(`arch-${arch[archStep][0]}`).classList.add('active');
        document.getElementById('arch-description').textContent = arch[archStep][1];
        live.textContent = arch[archStep][1];
      }
    }

    document.querySelectorAll('svg [role="button"]').forEach(element => {
      element.addEventListener('click',() => activateControl(element));
      element.addEventListener('keydown',event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault(); activateControl(element);
        }
      });
    });
    document.getElementById('previous').addEventListener('click',() => show(current-1));
    document.getElementById('next').addEventListener('click',() => show(current+1));
    document.getElementById('notes-toggle').addEventListener('click',() => toggleNotes());
    document.getElementById('notes-close').addEventListener('click',() => toggleNotes(false));
    document.getElementById('contents-open').addEventListener('click',() => contents.showModal());
    document.getElementById('contents-close').addEventListener('click',() => contents.close());
    document.getElementById('fullscreen').addEventListener('click',async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { live.textContent = 'Полноэкранный режим недоступен в этом окне.'; }
    });
    document.addEventListener('keydown',event => {
      if (['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName.toUpperCase()) || event.altKey || event.ctrlKey || event.metaKey) return;
      if (contents.open) return;
      if (['ArrowRight','PageDown'].includes(event.key)) { event.preventDefault(); show(current+1); }
      if (['ArrowLeft','PageUp'].includes(event.key)) { event.preventDefault(); show(current-1); }
      if (event.key === 'Home') { event.preventDefault(); show(0); }
      if (event.key === 'End') { event.preventDefault(); show(sections.length-1); }
      if (event.key.toLowerCase() === 'n') toggleNotes();
      if (event.key.toLowerCase() === 'g') contents.showModal();
      if (event.key.toLowerCase() === 'f') document.getElementById('fullscreen').click();
      if (event.key === 'Escape') toggleNotes(false);
    });
    window.addEventListener('hashchange',fromHash);
    fromHash();
    updateAssessment();
  })();
}
</script></body></html>
